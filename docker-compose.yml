version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: openinsider-db
    environment:
      POSTGRES_DB: openinsider
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: openinsider-redis
    ports:
      - "6379:6379"

  backend:
    build: ./backend
    container_name: openinsider-backend
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    volumes:
      - ./backend:/backend
    environment:
      PYTHONUNBUFFERED: 1
      ALLOWED_ORIGINS: "http://${SERVER_IP:-localhost}:${FRONTEND_PORT:-8100},http://localhost:8100"
      REDIS_URL: "redis://openinsider-redis:6379/0"
    depends_on:
      - db
      - redis

  frontend:
    build: ./frontend
    container_name: openinsider-frontend
    ports:
      - "${FRONTEND_PORT:-8100}:8100"
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    environment:
      - NEXT_PUBLIC_API_URL=${API_BASE_URL:-http://localhost:8000}
    depends_on:
      - backend

volumes:
  postgres_data:
