services:
  db:
    image: postgres:15-alpine
    container_name: openinsider-db
    restart: always
    environment:
      POSTGRES_DB: openinsider
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d openinsider"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: openinsider-redis
    restart: always
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    container_name: openinsider-backend
    restart: always
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    volumes:
      - ./backend:/backend
    environment:
      PYTHONUNBUFFERED: 1
      ALLOWED_ORIGINS: "*"
      DATABASE_URL: "postgresql://user:password@openinsider-db:5432/openinsider"
      REDIS_URL: "redis://openinsider-redis:6379/0"
      NVIDIA_API_KEY: "${NVIDIA_API_KEY}"
      NVIDIA_MODEL: "${NVIDIA_MODEL:-nvidia/nemotron-mini-4b-instruct}"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build: ./frontend
    container_name: openinsider-frontend
    restart: always
    ports:
      - "${FRONTEND_PORT:-8100}:8080"
    environment:
      - PORT=8080
      - NEXT_PUBLIC_API_URL=${API_BASE_URL:-https://bloomberg-api.sckirl.app}
    depends_on:
      - backend

  tunnel:
    image: cloudflare/cloudflared:latest
    container_name: openinsider-tunnel
    restart: always
    command: tunnel --no-autoupdate --protocol http2 run --token ${CLOUDFLARE_TUNNEL_TOKEN}
    environment:
      - CLOUDFLARE_TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN}
    depends_on:
      - backend

volumes:
  postgres_data:
